<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sophiel Pizarra</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ---------- the lab page around the phones ---------- */
:root{--bg:#E3E7EB;--fg:#121E2A;--fg2:#4B5B6B;--card:#fff;--rule:#121E2A1A;--acc:#3E5F7D;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070C12;--fg:#E6EDF3;--fg2:#9AACBC;--card:#131D28;--rule:#E6EDF31F;--acc:#8FB4D6;color-scheme:dark}}
:root[data-theme=dark]{--bg:#070C12;--fg:#E6EDF3;--fg2:#9AACBC;--card:#131D28;--rule:#E6EDF31F;--acc:#8FB4D6;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s}
::selection{background:#9CC3E466}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{cursor:text}
.lab{display:grid;grid-template-columns:360px minmax(0,1fr);gap:40px;max-width:1720px;margin:0 auto;padding:24px}
@media (max-width:900px){.lab{grid-template-columns:1fr;padding:16px;gap:24px}}
aside{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:18px;padding-right:6px}
@media (max-width:900px){aside{position:static;max-height:none}}
aside h1{font:750 26px/1.1 "Geist";letter-spacing:-.03em}
aside .lede{color:var(--fg2);margin-top:6px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl>b{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;border-radius:18px;padding:0 13px;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);font-size:13.5px;font-weight:550;display:inline-flex;align-items:center;gap:7px}
.chips button[aria-pressed=true]{background:var(--fg);color:var(--bg);box-shadow:none}
.chips i{width:12px;height:12px;border-radius:50%;flex:none}
.plan{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--rule)}
.plan summary{font:700 16px/1.3 "Geist";cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.plan summary::-webkit-details-marker{display:none}
.plan summary:after{content:"+";font-weight:500;color:var(--fg2)}
.plan[open] summary:after{content:"–"}
.plan h3{font:700 13.5px/1.3 "Geist";margin:14px 0 4px}
.plan p,.plan li{color:var(--fg2);font-size:13.5px;line-height:1.5}
.plan ul{padding-left:17px;display:flex;flex-direction:column;gap:3px}
.plan b{color:var(--fg);font-weight:650}
.ladder{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-top:8px;align-items:center}
.ladder i{width:34px;height:22px;border-radius:7px}
.ladder span{font-size:13px;color:var(--fg2)}
.ladder span b{display:block;font-size:13.5px}
.idx{display:flex;flex-direction:column;gap:12px}
.idx div>b{display:block;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-bottom:4px}
.idx button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:10px;font-size:13.5px;color:var(--fg2)}
.idx button:hover{background:var(--card);color:var(--fg)}
.idx button[aria-current=true]{background:var(--card);color:var(--fg);font-weight:650;box-shadow:inset 0 0 0 1px var(--rule)}
.stage{display:flex;justify-content:center;align-items:flex-start;min-width:0}
.stage.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:30px 20px;align-items:start}
.cell{display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer;border-radius:22px;padding:4px 0}
.cell .phone{zoom:.55;pointer-events:none}
.cell figcaption{font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.cell figcaption small{display:block;font-weight:450;color:var(--fg2);font-size:12px}
.cell:hover figcaption{color:var(--acc)}
.grp-h{grid-column:1/-1;font:700 18px/1.2 "Geist";letter-spacing:-.02em;padding-top:10px;border-top:1px solid var(--rule)}
.grp-h:first-child{border:0;padding-top:0}
.grp-h small{display:block;font:450 13.5px/1.4 "Geist";color:var(--fg2);letter-spacing:0;margin-top:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}

/* ---------- the phone ---------- */
.phone{width:392px;height:820px;border-radius:46px;overflow:hidden;position:relative;flex:none;isolation:isolate;
  background:var(--ground);color:var(--ink);font:15px/1.45 "Geist",system-ui,sans-serif;
  box-shadow:0 0 0 10px #0B0F13,0 0 0 11px #2A3038,0 30px 60px -24px #0007;
  --ease:cubic-bezier(.2,0,0,1);--expo:cubic-bezier(.16,1,.3,1);--gut:14px;
  transition:background .4s var(--expo)}
.phone :focus-visible{outline-color:var(--p)}
.phone ::selection{background:color-mix(in srgb,var(--p) 30%,transparent)}
.phone input{caret-color:var(--p)}
.num{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{height:36px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:13px;font-weight:650;position:relative;z-index:3}
.sb svg{width:40px;height:12px;fill:currentColor}
.view{position:absolute;left:0;right:0;top:36px;bottom:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;padding-bottom:28px}
.phone[data-nav=true] .view{padding-bottom:104px}
.view::-webkit-scrollbar{display:none}

.appbar{display:flex;align-items:center;gap:4px;min-height:60px;padding:0 var(--gut) 0 calc(var(--gut) + 6px)}
.appbar.back{padding-left:6px}
.appbar h1{flex:1;min-width:0;font:750 24px/1.1 "Geist";letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{display:block;font:500 13px/1.3 "Geist";color:var(--mut);letter-spacing:0}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .2s var(--expo),background .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.disc{background:var(--panel);box-shadow:var(--lift);width:44px;height:44px;margin:2px}
.pg{padding:0 var(--gut);display:flex;flex-direction:column;gap:8px}
.h2{font:700 16px/1.25 "Geist";letter-spacing:-.015em;padding:18px 6px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.h2 small{font:500 13px "Geist";color:var(--mut);white-space:nowrap;letter-spacing:0}
.h2 .link{font:600 13.5px "Geist";color:var(--p);letter-spacing:0;min-height:32px}
.foot{font-size:13px;color:var(--mut);padding:4px 8px 0;line-height:1.45}
.foot.c{text-align:center;display:flex;gap:6px;justify-content:center;align-items:center;padding-top:10px}
.foot .ic{width:15px;height:15px}

/* ---- the state strip (hero e) ---- */
.strip{position:relative;overflow:hidden;background:var(--hero);color:var(--hon);border-radius:30px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;transition:background .45s var(--expo),color .45s var(--expo)}
.strip:before{content:"";position:absolute;right:-80px;top:-100px;width:300px;height:300px;background:radial-gradient(closest-side,color-mix(in srgb,var(--hsig) 22%,transparent),transparent);pointer-events:none;transition:background .45s var(--expo)}
.strip>*{position:relative}
.s-top{display:flex;align-items:center;gap:14px;min-height:76px}
.s-top h2{font:800 32px/1.02 "Geist";letter-spacing:-.04em;text-wrap:balance}
.s-top p{font-size:14px;line-height:19px;color:var(--hsub);margin-top:5px;text-wrap:balance}
.strip[data-long] .s-top h2{font-size:28px}
.seal{display:grid;place-items:center;position:relative;color:var(--hero);flex:none;width:70px;height:70px}
.seal svg.sh{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s var(--expo)}
.seal svg.sh path{fill:var(--hsig);transition:fill .45s var(--expo)}
.seal .ic{position:relative;width:46%;height:46%;stroke-width:2.1}
.seal.spin svg.sh{animation:turn 6s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.s-meta{display:grid;grid-template-columns:1fr 1.15fr 1fr;border-radius:18px;background:color-mix(in srgb,var(--hon) 9%,transparent)}
.s-meta button{padding:9px 12px 10px;min-height:56px;text-align:left;font-size:12px;color:var(--hsub);min-width:0;border-radius:18px;transition:background .2s}
.s-meta button:hover{background:color-mix(in srgb,var(--hon) 7%,transparent)}
.s-meta button+button{box-shadow:inset 1px 0 0 color-mix(in srgb,var(--hon) 14%,transparent)}
.s-meta b{display:block;font-size:14px;font-weight:650;color:var(--hon);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-cause{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;background:color-mix(in srgb,var(--hon) 10%,transparent);min-height:58px}
.s-cause .ic{width:22px;height:22px;color:var(--hsig)}
.s-cause b{display:block;font-size:14px;font-weight:650;line-height:19px}
.s-cause small{display:block;font-size:13px;line-height:17px;color:var(--hsub)}
.s-note{font-size:13px;color:var(--hsub);text-align:center;margin-top:-4px}
.strip :focus-visible{outline-color:var(--hon);outline-offset:3px}
/* the stop gesture */
.slide{position:relative;height:60px;border-radius:30px;background:color-mix(in srgb,var(--hon) 12%,transparent);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x,0px) + 56px);border-radius:30px;background:color-mix(in srgb,var(--hsig) 36%,transparent);transition:width .35s var(--expo)}
.slide .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 44px 0 60px;text-align:center;font-weight:650;font-size:15px;line-height:19px;opacity:calc(1 - var(--k,0)*1.5);pointer-events:none}
.slide .lbl small{font-size:13px;font-weight:500;line-height:16px;color:var(--hsub)}
.slide .chev3{position:absolute;right:14px;top:0;bottom:0;display:flex;align-items:center;color:var(--hsub);opacity:calc(1 - var(--k,0)*1.5);pointer-events:none}
.slide .chev3 .ic{width:14px;height:14px;margin-left:-5px;animation:wave 1.8s var(--ease) infinite}
.slide .chev3 .ic:nth-child(2){animation-delay:.15s}.slide .chev3 .ic:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,100%{opacity:.35}40%{opacity:1}}
.thumb{position:absolute;left:4px;top:4px;width:52px;height:52px;border-radius:50%;background:var(--hsig);color:var(--hero);display:grid;place-items:center;cursor:grab;transform:translateX(var(--x,0px));transition:transform .35s var(--expo);box-shadow:0 4px 10px -2px #0006}
.thumb .ic{width:22px;height:22px}
.slide.drag .thumb,.slide.drag .fill{transition:none}
.slide.nudge .thumb{animation:nudge .7s var(--expo)}
@keyframes nudge{35%{transform:translateX(30px)}}

/* ---- buttons ---- */
.btn{min-height:48px;padding:0 22px;border-radius:24px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--expo),background .2s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn .ic{width:20px;height:20px}
.btn.wide{width:100%;min-height:60px;border-radius:30px;font-size:16px;gap:10px}
.btn.p{background:var(--p);color:var(--onp)}
.btn.tonal{background:var(--soft);color:var(--onsoft)}
.btn.out{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.text{color:var(--p);padding:0 14px}
.btn.sig{background:var(--hsig);color:var(--hero)}
.btn.ghost{background:color-mix(in srgb,var(--hon) 14%,transparent);color:var(--hon)}
.btn.danger{background:var(--badsoft);color:var(--bad)}
.btn.fix{min-height:40px;padding:0 14px;border-radius:12px;background:var(--warnsoft);color:var(--warn);font-size:14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent)}
.btn.mini{min-height:44px;padding:0 16px 0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.4px solid currentColor;border-right-color:transparent;animation:turn .8s linear infinite;flex:none}

/* ---- floating bar: wears the frame's colour, so every screen tells the state ---- */
.dock{position:absolute;z-index:10;left:12px;right:12px;bottom:14px;height:68px;background:var(--hero);border-radius:34px;display:flex;gap:2px;padding:5px;box-shadow:0 14px 30px -12px #000a,0 2px 6px -2px #0005;transition:background .45s var(--expo)}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;border-radius:29px;color:var(--hsub);position:relative;transition:background .3s var(--expo),color .3s var(--expo),transform .2s var(--expo)}
.nb:active{transform:scale(.95)}
.nb .ic{width:22px;height:22px}
.nb[aria-current=page]{background:color-mix(in srgb,var(--hsig) 20%,transparent);color:var(--hon)}
.nb[aria-current=page] .ic{color:var(--hsig)}
.nb .lk{position:absolute;top:8px;left:calc(50% + 7px);width:15px;height:15px;border-radius:50%;background:var(--hero);display:grid;place-items:center}
.nb .lk .ic{width:11px;height:11px;stroke-width:2.4;color:var(--hsub)}
.nb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- tiles: Hoy + 7 días ---- */
.tiles{display:grid;grid-template-columns:1fr 1.45fr;gap:8px}
.tile{border-radius:24px;background:var(--panel);padding:13px 15px 15px;display:flex;flex-direction:column;box-shadow:var(--lift);text-align:left;min-width:0;transition:transform .25s var(--expo),background .45s var(--expo)}
button.tile:active{transform:scale(.98)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font:600 13.5px "Geist";color:var(--mut)}
.tile .k .ic{width:16px;height:16px}
.big{font:800 46px/1 "Geist";letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-top:10px}
.tile small{font-size:13px;line-height:1.3;margin-top:6px;color:var(--mut)}
.tile.hoy{background:var(--p);color:var(--onp)}
.tile.hoy .k,.tile.hoy small{color:color-mix(in srgb,var(--onp) 82%,transparent)}
.bars{display:flex;align-items:flex-end;gap:6px;height:58px;margin-top:12px}
.bars i{flex:1;background:color-mix(in srgb,var(--p) 30%,var(--panel));border-radius:6px;min-height:4px;transition:background .45s var(--expo)}
.bars i.hi{background:var(--p)}
.days{display:flex;gap:6px;margin-top:6px}
.days span{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--mut)}
/* frozen: while the frame is not slate, nothing in slate claims "protected" */
.phone:not([data-chrome=ok]) .tile.hoy{background:var(--panel);color:var(--ink)}
.phone:not([data-chrome=ok]) .tile.hoy .k,.phone:not([data-chrome=ok]) .tile.hoy small{color:var(--mut)}
.phone:not([data-chrome=ok]) .bars i,.phone:not([data-chrome=ok]) .mag,.phone:not([data-chrome=ok]) .wk i{background:color-mix(in srgb,var(--mut) 32%,var(--panel))}
.phone:not([data-chrome=ok]) .bars i.hi,.phone:not([data-chrome=ok]) .wk .on i{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--mut) 55%,var(--panel)) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--mut) 55%,var(--panel))}

/* ---- lists ---- */
.list{background:var(--panel);border-radius:22px;padding:4px 0;box-shadow:var(--lift);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;width:100%;text-align:left;transition:background .2s;position:relative}
button.row:hover,label.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row+.row{box-shadow:0 -1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.row .tx span{display:block;font-size:13.5px;color:var(--mut);line-height:1.35;margin-top:1px}
.row em{font:700 18px "Geist";font-style:normal;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row .tm{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.row>.ic{color:var(--mut)}
.chev{color:var(--mut);width:20px;height:20px}
.ricon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--onsoft)}
.ricon .ic{width:21px;height:21px}
.ricon.warn{background:var(--warnsoft);color:var(--warn)}
.ricon.bad{background:var(--badsoft);color:var(--bad)}
.ricon.mute{background:var(--panel2);color:var(--mut)}
.app{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 0 0 1px #0000000f}
.app svg{display:block;width:100%;height:100%}
.letter{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font:750 17px "Geist";background:var(--panel2);color:var(--ink);text-transform:uppercase}
.mag{height:6px;border-radius:3px;background:var(--p);margin-top:7px;transition:background .45s var(--expo)}
.tag{font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex:none}
.tag .ic{width:13px;height:13px;stroke-width:2.2}
.tag.ink{background:var(--ink);color:var(--ground)}
.tag.line{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 28%,transparent);color:var(--ink)}
.tag.soft{background:var(--soft);color:var(--onsoft)}
.tag.b1{background:var(--p);color:var(--onp)}
.tag.b2{background:color-mix(in srgb,var(--p) 45%,var(--panel));color:var(--ink)}
.tag.b3{background:var(--panel2);color:var(--mut)}
.phone:not([data-chrome=ok]) .tag.b1{background:var(--ink);color:var(--ground)}
.group-t{font:650 13.5px "Geist";color:var(--mut);padding:16px 8px 6px}
.search{display:flex;align-items:center;gap:10px;height:54px;border-radius:27px;background:var(--panel);box-shadow:var(--lift);padding:0 18px;color:var(--mut)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15.5px;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--mut)}
.switch{width:52px;height:32px;border-radius:16px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--mut);position:relative;flex:none;transition:background .25s var(--expo)}
.switch:after{content:"";position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:all .3s var(--expo)}
[aria-checked=true]>.switch{background:var(--p);box-shadow:none}
[aria-checked=true]>.switch:after{left:24px;top:4px;width:24px;height:24px;background:var(--onp)}
.seg{display:flex;border-radius:26px;background:var(--panel2);padding:4px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:22px;font-size:14px;font-weight:600;color:var(--mut);transition:background .25s var(--expo),color .25s;padding:0 6px}
.seg button[aria-checked=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px #0002}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--panel);text-align:left;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 9%,transparent);transition:box-shadow .25s var(--expo),background .25s var(--expo)}
.opt[aria-checked=true]{box-shadow:inset 0 0 0 2px var(--p);background:color-mix(in srgb,var(--p) 7%,var(--panel))}
.opt .radio{grid-column:1;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--mut);grid-row:1/span 2}
.opt[aria-checked=true] .radio{box-shadow:inset 0 0 0 2px var(--p),inset 0 0 0 6px var(--panel),inset 0 0 0 11px var(--p)}
.opt b{font:650 16px "Geist"}
.opt span{font-size:13.5px;color:var(--mut);grid-column:2;line-height:1.4}
.opt .tag{grid-row:1/span 2;grid-column:3}
.opt[disabled]{opacity:.55}
.help{font-size:13.5px;color:var(--mut);padding:8px 8px 0}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:20px;background:var(--panel);box-shadow:var(--lift);font-size:14px}
.banner .tx{flex:1;min-width:0}
.banner b{display:block;font-weight:650;font-size:14.5px}
.banner span{color:var(--mut);font-size:13px}
.banner.unl{background:var(--soft);color:var(--onsoft);box-shadow:none}
.banner.unl span{color:var(--onsoft);opacity:.85}
.banner.warn{background:var(--warnsoft);color:var(--warn);box-shadow:none}
.banner.warn span{color:inherit;opacity:.9}
.skel{background:var(--skel);border-radius:8px;animation:pulse 1.4s var(--ease) infinite}
@keyframes pulse{50%{opacity:.55}}

/* ---- Historial ---- */
.verdict{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:24px;background:var(--panel);box-shadow:var(--lift)}
.verdict .tx{flex:1}
.verdict b{display:block;font:700 18px/1.2 "Geist";letter-spacing:-.02em}
.verdict span{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:150px;margin-top:12px}
.wk button{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut);border-radius:12px;padding:4px 0}
.wk button b{font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.wk i{display:block;width:78%;border-radius:8px;background:color-mix(in srgb,var(--p) 28%,var(--panel));min-height:5px;transition:background .3s}
.wk .on i{background:var(--p)}
.wk .on{color:var(--ink);background:color-mix(in srgb,var(--p) 8%,transparent)}
.panel{background:var(--panel);border-radius:24px;box-shadow:var(--lift);padding:14px 16px 12px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;font:700 15.5px "Geist";letter-spacing:-.01em}
.panel .ph small{font:500 13px "Geist";color:var(--mut);letter-spacing:0}
.report{background:var(--panel);border-radius:24px;box-shadow:var(--lift);padding:20px 20px 18px;font-size:14.5px;line-height:1.6;font-variant-numeric:tabular-nums}
.report h3{font:750 18px/1.25 "Geist";letter-spacing:-.02em;margin-bottom:8px}
.report .ln{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.report .ln span:last-child{font-weight:650}
.report hr{border:0;border-top:1px dashed color-mix(in srgb,var(--ink) 18%,transparent);margin:10px 0}
.report .ft{font-size:13px;color:var(--mut);margin-top:10px}

/* ---- sheets and dialogs ---- */
.scrim{position:absolute;inset:0;z-index:20;background:#0A1119a6;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .3s var(--expo)}
.scrim.mid{justify-content:center;padding:0 24px}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--ground);border-radius:30px 30px 0 0;padding:10px 18px 30px;animation:up .45s var(--expo)}
@keyframes up{from{transform:translateY(40%)}}
.grab{width:36px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 25%,transparent);margin:2px auto 14px}
.sheet h2{font:750 22px/1.2 "Geist";letter-spacing:-.025em}
.dialog{background:var(--panel);border-radius:28px;padding:24px 24px 14px;animation:pop .35s var(--expo)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.dialog h2{font:750 22px/1.2 "Geist";letter-spacing:-.025em}
.dialog p{color:var(--mut);margin-top:8px}
.dialog .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:18px}
.btn.textbad{color:var(--bad);padding:0 14px}

/* ---- PIN ---- */
.pin{display:flex;flex-direction:column;align-items:center;text-align:center}
.pin h2{font:750 24px/1.2 "Geist";letter-spacing:-.03em;margin-top:14px}
.pin p{color:var(--mut);margin-top:4px;font-size:14.5px}
.dots{display:flex;gap:14px;margin:22px 0 6px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--mut);transition:all .2s var(--expo)}
.dots i.on{background:var(--ink);box-shadow:none;transform:scale(1.1)}
.pin .err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:20px}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px 26px;margin-top:10px}
.keys button{height:76px;border-radius:50%;font:600 28px "Geist";display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent);transition:transform .15s var(--expo),background .15s}
.keys button:active{transform:scale(.92);background:color-mix(in srgb,var(--ink) 14%,transparent)}
.keys button.bare{background:none;font-size:14px;font-weight:600;color:var(--mut)}
.pin .seal{width:64px;height:64px}

/* ---- Child-facing (always dark) ---- */
.child{position:absolute;inset:0;background:var(--hero);color:var(--hon);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px 36px;overflow:hidden}
.child:before{content:"";position:absolute;left:50%;top:18%;width:420px;height:420px;transform:translate(-50%,-30%);background:radial-gradient(closest-side,color-mix(in srgb,var(--hsig) 20%,transparent),transparent)}
.child>*{position:relative}
.child h2{font:800 30px/1.08 "Geist";letter-spacing:-.04em;margin-top:26px;text-wrap:balance}
.child p{color:var(--hsub);margin-top:10px;font-size:15.5px;text-wrap:balance}
.child>.blockicon{margin-top:auto}
.child .acts{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:8px}
.child .btn.text{color:var(--hsub)}
.blockicon{width:112px;height:112px;position:relative;display:grid;place-items:center}
.blockicon svg.sh{position:absolute;inset:0;width:100%;height:100%}
.blockicon svg.sh path{fill:var(--hon)}
.blockicon .app{width:62px;height:62px;border-radius:18px;position:relative}
.blockicon .lockb{position:absolute;right:2px;bottom:2px;width:38px;height:38px;border-radius:50%;background:var(--hsig);color:var(--hero);display:grid;place-items:center;box-shadow:0 0 0 4px var(--hero)}
.blockicon .lockb .ic{width:19px;height:19px;stroke-width:2.3}
.child .keys button{background:color-mix(in srgb,var(--hon) 10%,transparent);color:var(--hon)}
.child .keys button.bare{background:none;color:var(--hsub)}
.child .dots i{box-shadow:inset 0 0 0 2px var(--hsub)}
.child .dots i.on{background:var(--hon)}

/* ---- the mask over another app ---- */
.feed{position:absolute;inset:36px 0 0;background:#fff;color:#111;overflow:hidden}
.feed .fh{height:52px;display:flex;align-items:center;padding:0 16px;font:700 20px "Geist";letter-spacing:-.02em;gap:10px;border-bottom:1px solid #0000000f}
.post{padding:10px 0 14px}
.post .who{display:flex;align-items:center;gap:10px;padding:0 14px 10px;font-size:14px;font-weight:600}
.post .who i{width:32px;height:32px;border-radius:50%;background:var(--av)}
.post .img{height:300px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);background:var(--ph);position:relative}
.post .img:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 35%,#ffffff55 0 18%,transparent 19%),radial-gradient(circle at 72% 70%,#0000001f 0 26%,transparent 27%)}
.post .cap{padding:10px 14px 0;font-size:13.5px;color:#333}
.post .cap b{color:#111}
.mk{position:relative;z-index:1;background-color:#14212E;background-image:radial-gradient(#9CC3E4cc .9px,transparent 1.3px),radial-gradient(#9CC3E466 .9px,transparent 1.3px);background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;display:grid;place-items:center;color:#AFC0D0;font-size:11px;font-weight:650;letter-spacing:.02em}
.mk.l{animation:mk 2.4s var(--expo) both}
@keyframes mk{from{opacity:0}}

/* ---- wizard ---- */
.wiz{position:absolute;inset:36px 0 0;display:flex;flex-direction:column;padding:6px 22px 26px}
.wiz .top{display:flex;align-items:center;gap:8px;min-height:52px}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent);transition:background .3s}
.prog i.on{background:var(--p)}
.wiz .step{font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.wiz .body{flex:1;overflow-y:auto;scrollbar-width:none;padding-top:18px;display:flex;flex-direction:column;gap:10px}
.wiz .body::-webkit-scrollbar{display:none}
.wiz h2{font:800 32px/1.05 "Geist";letter-spacing:-.04em;text-wrap:balance;margin-top:10px}
.wiz .lead{color:var(--mut);font-size:15.5px;text-wrap:pretty}
.wiz .acts{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.wiz .seal{width:84px;height:84px;--hero:var(--p);--hsig:var(--soft)}
.wiz .seal{color:var(--onsoft)}
.wiz .seal svg.sh path{fill:var(--soft)}
.steps{counter-reset:s}
.steps .row:before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--onsoft);display:grid;place-items:center;font:700 14px "Geist";flex:none}
details.q{background:var(--panel);border-radius:22px;box-shadow:var(--lift);padding:0 16px}
details.q summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q p{white-space:pre-line;color:var(--mut);font-size:14px;padding-bottom:14px}
.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:14px;border-radius:28px;background:var(--hero);margin-top:6px}
.wall b{aspect-ratio:1;border-radius:9px;background:var(--htile)}
.wall b.m{background-color:#0C1824;background-image:radial-gradient(color-mix(in srgb,var(--hsig) 85%,white) .9px,transparent 1.3px),radial-gradient(color-mix(in srgb,var(--hsig) 55%,transparent) .9px,transparent 1.3px);background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hsig) 60%,transparent);animation:mk 1.2s var(--expo) both}

/* ---- Remote ---- */
.kid{position:relative;overflow:hidden;background:var(--hero);color:var(--hon);border-radius:26px;padding:14px 14px 14px 14px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;transition:transform .25s var(--expo)}
.kid:active{transform:scale(.985)}
.kid .kt{display:flex;align-items:center;gap:12px}
.kid .seal{width:50px;height:50px}
.kid .tx{flex:1;min-width:0}
.kid .tx b{display:block;font:750 18px/1.2 "Geist";letter-spacing:-.02em}
.kid .tx span{display:block;font-size:13px;color:var(--hsub);margin-top:2px}
.kid .when{font-size:12.5px;color:var(--hsub);white-space:nowrap;align-self:flex-start;margin-top:3px}
.kid .ka{display:flex;gap:8px;align-items:center}
.kid .ka .msg{flex:1;font-size:13px;color:var(--hsub)}
.kid.gone{background:var(--panel);color:var(--ink);box-shadow:var(--lift)}
.kid.gone .tx span,.kid.gone .when{color:var(--mut)}
.out{font-size:13.5px;padding:10px 14px;border-radius:16px;background:var(--panel);box-shadow:var(--lift);display:flex;gap:10px;align-items:center;margin-top:-2px}
.out .ic{width:18px;height:18px;color:var(--mut)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600;color:var(--mut);padding-left:6px}
.field input{height:56px;border-radius:18px;background:var(--panel);box-shadow:var(--lift),inset 0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent);padding:0 18px;font-size:16px;color:var(--ink);outline:none}
.field input:focus{box-shadow:inset 0 0 0 2px var(--p)}
.qr{background:#fff;border-radius:26px;padding:18px;display:grid;place-items:center;box-shadow:var(--lift);position:relative}
.qr svg{width:220px;height:220px;display:block}
.qr .seal{position:absolute;width:52px;height:52px;--hero:#fff;--hsig:#14212E;color:#fff}
.role{display:flex;gap:14px;align-items:center;padding:18px 16px;border-radius:24px;background:var(--panel);text-align:left;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 9%,transparent);width:100%}
.role[aria-checked=true]{box-shadow:inset 0 0 0 2px var(--p);background:color-mix(in srgb,var(--p) 7%,var(--panel))}
.role .ricon{width:52px;height:52px;border-radius:16px}
.role .ricon .ic{width:26px;height:26px}
.role b{display:block;font:700 17px "Geist";letter-spacing:-.01em}
.role span{display:block;color:var(--mut);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
/* ================= tokens ================= */
/* one slate family at three depths; the state only swaps the frame (strip + floating bar), never the content */
const BASE={
  l:{ground:'#EEF1F4',panel:'#FFFFFF',panel2:'#E3E8ED',ink:'#121E2A',mut:'#4F6071',p:'#3E5F7D',onp:'#FFFFFF',soft:'#DCE6EF',onsoft:'#1B3248',
     bad:'#B01E28',badsoft:'#FBE3E3',warn:'#8A5200',warnsoft:'#FCEFD8',skel:'#E3E8ED',lift:'0 1px 2px #121E2A12, 0 4px 14px -8px #121E2A26'},
  d:{ground:'#0A1119',panel:'#131D28',panel2:'#1D2B3A',ink:'#E6EDF3',mut:'#97A9BA',p:'#8FB4D6',onp:'#0C1822',soft:'#243A4E',onsoft:'#CFE2F2',
     bad:'#FF8A8F',badsoft:'#3A1717',warn:'#F0B54E',warnsoft:'#33260E',skel:'#1D2B3A',lift:'0 0 0 1px #E6EDF314'}};
const CHROME={ // the frame: slate protects, graphite is off on purpose, amber stopped by itself, red should protect and can't
  ok:  {hero:'#1E3A54',htile:'#2B4B69',hsig:'#A9CDEB',hsub:'#B7CADC',hon:'#F2F7FB'},
  off: {hero:'#383C42',htile:'#484D55',hsig:'#E1E4E8',hsub:'#C5C9CF',hon:'#F5F6F7'},
  stop:{hero:'#6A4300',htile:'#7E5208',hsig:'#FFC77D',hsub:'#F1D9B3',hon:'#FFF7EA'},
  gap: {hero:'#8A1C24',htile:'#A0262E',hsig:'#FFC9CC',hsub:'#F6D0D2',hon:'#FFFFFF'}};
const CK={ok:'ok',starting:'ok',ready:'off',missing:'off',stopped:'stop',gap:'gap'};
const vars=(dark,ck)=>Object.entries({...BASE[dark?'d':'l'],...CHROME[ck]}).map(([k,v])=>`--${k}:${v}`).join(';');

/* ================= data (illustrative) ================= */
const APPS=[
  {id:'ig',name:'Instagram',bg:'url(#ig-grad)',fg:'#fff',rule:'normal',d:[3,6,2,8,4,3,5]},
  {id:'ch',name:'Chrome',bg:'#fff',fg:'#1A73E8',rule:'normal',d:[1,2,0,4,1,2,2]},
  {id:'yt',name:'YouTube',bg:'#fff',fg:'#FF0000',rule:'normal',d:[0,1,0,1,0,0,1]},
  {id:'tt',name:'TikTok',bg:'#000',fg:'#fff',tt:true,rule:'blocked',d:[2,1,3,0,0,0,0]},
  {id:'sc',name:'Snapchat',bg:'#FFFC00',fg:'#fff',stroke:'#000',rule:'normal',d:[0,0,1,0,0,1,0]},
  {id:'wa',name:'WhatsApp',bg:'#25D366',fg:'#fff',rule:'trusted',d:[0,0,0,0,0,0,0]},
  {id:'rb',name:'Roblox',bg:'#232527',fg:'#fff',rule:'normal',d:[0,0,0,0,0,0,0]}];
const DAYS=['V','S','D','L','M','X','J'], DAYN=['viernes','sábado','domingo','lunes','martes','miércoles','jueves'];
const CARE={strict:['Tapar más','Tapa también lo que no está claro.'],normal:['Normal','Equilibrio entre tapar de más y de menos.'],relaxed:['Tapar menos','Tapa solo lo claro. Puede dejar pasar dudas.']};
const HOW={light:['Ahorro','Revisa menos. Gasta menos batería.'],balanced:['Equilibrado','Equilibrio entre protección y batería.'],thorough:['Reforzado','Revisa más zonas. Gasta más batería.'],precise:['Detallado','Tapa solo la parte que lo necesita, no todo el bloque (beta).']};
const RULE={normal:['Normal','Sophiel la revisa y tapa lo explícito'],blocked:['Bloqueada','No se abre mientras Sophiel protege'],trusted:['De confianza','Nunca se revisa ni se tapa']};
const sum=a=>a.reduce((x,y)=>x+y,0);
const perDay=()=>DAYS.map((_,i)=>sum(APPS.map(a=>a.d[i])));
const week=()=>sum(perDay()), dayN=i=>perDay()[i];
const topApps=n=>APPS.map(a=>({...a,w:sum(a.d)})).filter(a=>a.w).sort((x,y)=>y.w-x.w).slice(0,n);
const blocked=()=>APPS.filter(a=>a.rule==='blocked').length;
/* a day's Log, newest first; kinds follow CONTEXT.md */
const LOG=[
  {t:'21:58',k:'masked',a:'ig',z:2,band:1},
  {t:'20:37',k:'open',a:'tt'},
  {t:'19:10',k:'masked',a:'ch',z:1,band:2},
  {t:'18:02',k:'masked',a:'ig',z:3,band:1},
  {t:'17:55',k:'unchecked',lbl:'Netflix'},
  {t:'16:22',k:'tamper',what:'Accesibilidad'},
  {t:'14:32',k:'gap'},
  {t:'13:40',k:'masked',a:'ig',z:1,band:3},
  {t:'12:06',k:'masked',a:'yt',z:1,band:2},
  {t:'07:12',k:'on'}];
const KIDS=[
  {n:'Teléfono de Sofi',st:'ok',when:'hace 4 s'},
  {n:'Tablet de Leo',st:'gap',when:'hace 6 s'},
  {n:'Teléfono de Mateo',st:'offline',when:''},
  {n:'Teléfono viejo',st:'gone',when:''}];

/* ================= state ================= */
const DEF={view:'one',theme:'light',state:'ok',screen:'inicio',care:'normal',how:'balanced',keep:true,label:true,peek:false,esc:true,
  unlocked:true,pin:'',pinFor:'ajustes',pinErr:false,wiz:0,filter:'all',day:6,q:'',kidTab:'log',tema:'sistema',role:'child',signup:false,ruleApp:'ch',paired:false};
const S={...DEF};
try{const s=JSON.parse(localStorage.getItem('sophiel-pizarra')||'{}');['view','theme','state','screen','wiz'].forEach(k=>k in s&&(S[k]=s[k]))}catch{}
const $=s=>document.querySelector(s), stage=$('#stage'), side=$('#side');
const ic=(n,c='ic')=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const on=()=>S.state==='ok'||S.state==='starting';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= pieces ================= */
function appIcon(a,cls='app'){a=typeof a==='string'?APPS.find(x=>x.id===a):a;
  const g=(x,f,extra='')=>`<use href="#a-${a.id}" x="${x}" y="${x}" width="22" height="22" fill="${f}" ${extra}/>`;
  return `<span class="${cls}" aria-hidden="true"><svg viewBox="0 0 40 40"><rect width="40" height="40" fill="${a.bg}"/>${a.tt?g(8,'#25F4EE')+g(10,'#FE2C55'):''}${g(9,a.fg,a.stroke?`stroke="${a.stroke}" stroke-width="1.2"`:'')}</svg></span>`;
}
const letter=n=>`<span class="letter" aria-hidden="true">${n[0]}</span>`;
const sbar=()=>`<div class="sb" aria-hidden="true"><span class="num">9:41</span><svg viewBox="0 0 40 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><rect x="24" y="1.5" width="14" height="9" rx="2.5" fill="none" stroke="currentColor"/><rect x="26" y="3.5" width="9" height="5" rx="1"/></svg></div>`;
function appbar(title,{back,action='',sub=''}={}){
  return `<header class="appbar ${back?'back':''}">${back?`<button class="iconbtn" data-go="${back}" aria-label="Atrás">${ic('back')}</button>`:''}<h1>${title}${sub?`<span class="sub">${sub}</span>`:''}</h1>${action}</header>`;
}
const seal=(icon,lobes)=>`<div class="seal${icon==='spin'?' spin':''}" data-cookie="${lobes}">${ic(icon==='spin'?'shield':icon)}</div>`;
const sw=(key,title,text,dis='')=>`<button class="row" data-tog="${key}" role="switch" aria-checked="${!!S[key]}" ${dis}><span class="tx"><b>${title}</b>${text?`<span>${text}</span>`:''}</span><span class="switch" aria-hidden="true"></span></button>`;
const nav=(icon,title,text,go,end='')=>`<button class="row" ${go?`data-go="${go}"`:''}><span class="ricon">${ic(icon)}</span><span class="tx"><b>${title}</b>${text?`<span>${text}</span>`:''}</span>${end||ic('chev','ic chev')}</button>`;
function bars(){const d=perDay(), m=Math.max(...d,1);
  return `<div class="bars" aria-hidden="true">${d.map((v,i)=>`<i class="${i===6?'hi':''}" style="height:${Math.max(6,v/m*100)}%"></i>`).join('')}</div><div class="days" aria-hidden="true">${DAYS.map(x=>`<span>${x}</span>`).join('')}</div>`;
}
function appRows(list,go='hist-apps'){const max=list[0]?.w||1;
  return `<div class="list">${list.map(a=>`<button class="row" data-go="${go}">${appIcon(a)}<span class="tx"><b>${a.name}</b><span class="mag" style="width:${a.w/max*100}%"></span></span><em>${a.w}</em>${ic('chev','ic chev')}</button>`).join('')}</div>`;
}
function keypad(){
  const k=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}" aria-label="${n}">${n}</button>`).join('');
  return `<div class="keys">${k}<button class="bare" data-go="${S.screen==='guard'?'guard':'pin'}">¿Olvidaste<br>el PIN?</button><button data-key="0" aria-label="0">0</button><button class="bare" data-key="del" aria-label="Borrar">${ic('del')}</button></div>`;
}
const dots=(n=4)=>`<div class="dots" aria-label="${S.pin.length} dígitos escritos">${Array.from({length:n},(_,i)=>`<i class="${i<S.pin.length?'on':''}"></i>`).join('')}</div>`;

/* ================= Inicio: the strip ================= */
const META=()=>{const b=blocked();return `<div class="s-meta"><button data-go="ajustes">Cuánto tapa<b>${CARE[S.care][0]}</b></button><button data-go="ajustes">Revisión<b>${HOW[S.how][0]}</b></button><button data-go="apps">Apps<b>${b} ${b===1?'bloqueada':'bloqueadas'}</b></button></div>`};
const SLIDE=`<div class="slide" data-slide><span class="fill"></span><span class="lbl"><b>Desliza para detener</b><small>Pide el PIN</small></span><span class="chev3" aria-hidden="true">${ic('chev')}${ic('chev')}${ic('chev')}</span><button class="thumb" data-slide-thumb aria-label="Detener protección. Pide el PIN.">${ic('stop')}</button></div>`;
const START=(dis)=>`<button class="btn sig wide" data-act="start" ${dis?'disabled':''}>${ic('shield-ok')}Iniciar protección</button>`;
function strip(){
  const t={
    ok:      [seal('lock',10),'Protegido','Compartir pantalla',META()+SLIDE],
    starting:[seal('spin',10),'Iniciando…','Android te pedirá permiso para capturar la pantalla',`<div class="s-cause">${ic('phone')}<span><b>Permiso de captura</b><small>Hay que aceptarlo cada vez que inicias. No se guarda ninguna imagen.</small></span></div><p class="s-note">Si cierras el permiso, la protección no se inicia</p>`],
    ready:   [seal('shield',0),'Listo para iniciar','Solo tapa lo explícito. Nada sale del teléfono.',META()+START()],
    missing: [seal('shield-alert',0),'Faltan 2 cosas','Permite mostrar la máscara para poder iniciar',START(true)],
    stopped: [seal('pause',0),'Se detuvo','La protección se apagó sola a las 14:32',`<div class="s-cause">${ic('refresh')}<span><b>El teléfono se reinició</b><small>La protección no vuelve sola</small></span></div>`+START()],
    gap:     [seal('unlock',0),'Protección interrumpida','Nada revisa la pantalla desde las 14:32',`<div class="s-cause">${ic('access')}<span><b>La accesibilidad está apagada</b><small>Sin ella, Sophiel no sigue protegiendo. Actívala y toca Iniciar.</small></span></div><button class="btn sig wide" data-act="fixgap">${ic('access')}Activar</button>`]
  }[S.state];
  return `<section class="strip" ${S.state==='gap'?'data-long':''} aria-label="Estado de la protección"><div class="s-top">${t[0]}<div><h2>${t[1]}</h2><p>${t[2]}</p></div></div>${t[3]}</section>`;
}
function inicio(){
  const td=dayN(6);
  const needs=S.state==='missing'?`<h2 class="h2">Para funcionar</h2><div class="list"><div class="row"><span class="ricon warn">${ic('layers')}</span><span class="tx"><b>Mostrar la máscara</b><span>Sin permiso: Android no deja dibujar la máscara</span></span><button class="btn fix" data-act="fix">Permitir</button></div></div>
    <h2 class="h2">Recomendado</h2><div class="list"><div class="row"><span class="ricon warn">${ic('bell')}</span><span class="tx"><b>Avisos</b><span>No verás el aviso cuando se pause</span></span><button class="btn fix" data-act="fix">Activar</button></div></div>`:'';
  const blk=S.state==='ok'?`<div class="banner">${appIcon('ig')}<span class="tx"><b>Instagram bloqueada · 12 min</b><span>La bloqueó Sophiel: 3 veces en 10 min</span></span><button class="btn text mini" data-go="apps">Ver</button></div>`:'';
  const sub=on()?'tapados hoy':S.state==='ready'||S.state==='missing'?'Nada que cubrir ahora':'antes de las 14:32';
  return appbar('Sophiel')+`<div class="pg">${strip()}${needs}${blk}
    <div class="tiles"><button class="tile hoy" data-go="historial"><span class="k">Hoy${ic('chev')}</span><span class="big num">${td}</span><small>${sub}</small></button>
    <button class="tile" data-go="historial"><span class="k"><span>Últimos 7 días · <span class="num">${week()}</span></span>${ic('chev')}</span>${bars()}</button></div>
    <h2 class="h2">Más tapados <small>7 días</small></h2>${appRows(topApps(3))}
    <p class="foot c">${ic('lock')}Solo quien tiene el PIN puede detenerlo o abrir Ajustes</p></div>`;
}

/* ================= Historial ================= */
const BAND={1:['Explícito','b1'],2:['Probable','b2'],3:['Dudoso','b3']};
function logRow(r,letters){
  const A=r.a&&APPS.find(x=>x.id===r.a), I=a=>letters?letter(a.name):appIcon(a);
  const tm=`<span class="tm">${r.t}</span>`;

function qrSVG(){ /* illustrative: a fixed pattern, not a real code */
  let r='';const n=29,f=(x,y)=>((x*7+y*13+x*y*3)%5<2)^((x^y)&1&&x%3===0);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7;
    if(inF(0,0)||inF(n-7,0)||inF(0,n-7))continue;if(x>10&&x<18&&y>10&&y<18)continue;if(f(x,y))r+=`M${x} ${y}h1v1h-1z`}
  const fp=(a,b)=>`<path d="M${a} ${b}h7v7h-7zM${a+1} ${b+1}v5h5v-5z" fill-rule="evenodd"/><rect x="${a+2}" y="${b+2}" width="3" height="3"/>`;
  return `<svg viewBox="-1 -1 31 31" fill="#121E2A" aria-label="Código QR de ejemplo"><path d="${r}"/>${fp(0,0)}${fp(n-7,0)}${fp(0,n-7)}</svg>`;
}

function cookies(root){root.querySelectorAll('[data-cookie]').forEach(c=>{if(c.querySelector(':scope>svg.sh'))return;const n=+c.dataset.cookie;let d='';
  if(n){for(let k=0;k<=360;k+=2){const t=k*Math.PI/180,r=44+5*Math.cos(n*t);d+=(k?'L':'M')+(50+r*Math.cos(t)).toFixed(2)+' '+(50+r*Math.sin(t)).toFixed(2)}d+='Z'}
  else d='M26 6H74Q94 6 94 26V74Q94 94 74 94H26Q6 94 6 74V26Q6 6 26 6Z';
  c.insertAdjacentHTML('afterbegin',`<svg class="sh" viewBox="0 0 100 100" aria-hidden="true"><path d="${d}"/></svg>`)})}

  <details class="plan" open><summary>El plan</summary>

function render(){

  }else{
    stage.className='stage';
    if(!cur||cur.id!==S.screen)cur=ALL.find(s=>s.id===S.screen&&(!s.st||Object.entries(s.st).every(([k,v])=>k==='pin'||S[k]===v)))||ALL.find(s=>s.id===S.screen)||ALL[0];
    const top=stage.querySelector('.view')?.scrollTop||0;
    stage.innerHTML=phone(cur);
    const v=stage.querySelector('.view'); if(v)v.scrollTop=top;

  }

function fit(){const p=stage.querySelector('.phone');if(!p)return;p.style.zoom=1;
  const z=Math.min(1.15,(innerHeight-60)/(p.offsetHeight+22));p.style.zoom=Math.max(.5,z).toFixed(3)}
addEventListener('resize',()=>S.view==='one'&&fit());

/* ================= behaviour (prototype only) ================= */
function go(id){S.screen=id;cur=null;if(id==='pin'){S.pin='';S.pinErr=false}render();const v=stage.querySelector('.view');if(v)v.scrollTop=0}
function say(t){$('#live').textContent=t}
function startProtection(){S.state='starting';go('inicio');say('Iniciando protección');setTimeout(()=>{if(S.state==='starting'){S.state='ok';render();say('Protegido')}},1600)}
document.addEventListener('click',e=>{
  const t=e.target;
  const c=t.closest('[data-ctl]'); if(c){const[k,v]=c.dataset.ctl.split(':');S[k]=v;if(k==='state'&&S.view==='one'&&!byId(S.screen)?.nav)S.screen='inicio';cur=null;return render()}
  const pk=t.closest('[data-pick]'); if(pk){const s=ALL[+pk.dataset.pick];Object.assign(S,s.st||{});S.screen=s.id;S.view='one';cur=s;render();scrollTo({top:0});return}
  if(S.view!=='one'||!t.closest('#stage'))return;
  if(t.closest('[data-stop]')&&!t.closest('[data-go],[data-set],[data-setrule],[data-act]'))return;
  const b=t.closest('[data-go],[data-act],[data-set],[data-tog],[data-key],[data-wiz],[data-day],[data-rule],[data-setrule]'); if(!b)return;
  const d=b.dataset;
  if(d.go){if(d.go==='ajustes'&&!S.unlocked){S.pinFor='ajustes';return go('pin')}if(d.go==='pin')S.pinFor='ajustes';return go(d.go)}
  if(d.set){const[k,v]=d.set.split(':');S[k]=v;if(k==='tema')S.theme=v==='oscuro'?'dark':'light';return render()}
  if(d.tog){S[d.tog]=!S[d.tog];return render()}
  if(d.day){S.day=+d.day;return render()}
  if(d.rule){S.ruleApp=d.rule;S.screen='rule';cur=byId('rule');return render()}
  if(d.setrule){APPS.find(a=>a.id===S.ruleApp).rule=d.setrule;return render()}
  if(d.key){
    if(d.key==='del')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=d.key;
    S.pinErr=false;render();
    if(S.pin.length===4){setTimeout(()=>{
      if(S.screen==='wizard'){S.pin='';S.wiz=2;return render()}
      if(S.pin==='0000'){S.pinErr=true;S.pin='';return render()}
      S.pin='';S.unlocked=true;
      if(S.pinFor==='stop'){S.state='ready';say('Protección detenida');return go('inicio')}
      go(S.screen==='guard'?'guard':'ajustes')},220)}
    return}
  if(d.wiz){if(d.wiz==='done'){S.wiz=0;return startProtection()}S.wiz=Math.max(0,Math.min(WIZ.length-1,S.wiz+ +d.wiz));return render()}
  switch(d.act){
    case 'start':return startProtection();
    case 'fixgap':case 'fix':S.state='ready';return render();
    case 'lock':S.unlocked=false;return go('inicio');
    case 'signup':S.signup=!S.signup;return render();
    case 'pairdone':S.paired=true;return render();
    case 'unpair':S.paired=false;return render();
  }
});
document.addEventListener('keydown',e=>{const c=e.target.closest?.('.cell,[role=link][data-go]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click()}});
stage.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#alist').innerHTML=appListHTML()}});
/* swipe to stop: a deliberate gesture instead of a stray tap, then the PIN; Enter on the thumb is the keyboard path */
stage.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-slide-thumb]');if(!t)return;
  const sl=t.parentElement, z=parseFloat(stage.querySelector('.phone').style.zoom)||1, max=sl.clientWidth-60, x0=e.clientX; let x=0;
  t.setPointerCapture(e.pointerId);sl.classList.add('drag');
  const mv=ev=>{x=Math.max(0,Math.min(max,(ev.clientX-x0)/z));sl.style.setProperty('--x',x+'px');sl.style.setProperty('--k',(x/max).toFixed(3))};
  const up=()=>{t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointercancel',up);sl.classList.remove('drag');
    if(x>=max*.85){S.pinFor='stop';return go('pin')}
    sl.style.setProperty('--x','0px');sl.style.setProperty('--k',0);
    if(x<6){sl.classList.add('nudge');setTimeout(()=>sl.classList.remove('nudge'),750)}};
  t.addEventListener('pointermove',mv);t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
});
stage.addEventListener('click',e=>{const t=e.target.closest('[data-slide-thumb]');if(t&&e.detail===0){S.pinFor='stop';go('pin')}});
